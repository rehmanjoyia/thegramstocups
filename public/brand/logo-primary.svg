<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 48" fill="none" width="280" height="48">
  <!-- Measuring Cup on Scale Mark -->
  <g transform="translate(0, 4)">
    <!-- Digital Scale Base -->
    <rect x="2" y="32" width="36" height="6" rx="2" fill="#17202A"/>
    <rect x="14" y="34" width="12" height="2" rx="0.5" fill="#A94524"/>
    <path d="M 6 32 L 8 28 L 32 28 L 34 32 Z" fill="#D9D0C3"/>
    <!-- Measuring Cup -->
    <path d="M 10 8 L 30 8 L 28 27 L 12 27 Z" fill="#FBF8F2" stroke="#17202A" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 30 11 C 35 11 36 21 29 22" fill="none" stroke="#17202A" stroke-width="2" stroke-linecap="round"/>
    <!-- Pour Spout -->
    <path d="M 9 8 L 6 6 L 12 8" stroke="#17202A" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Measurement lines -->
    <line x1="22" y1="13" x2="26" y2="13" stroke="#A94524" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="20" y1="17" x2="26" y2="17" stroke="#17202A" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="22" y1="21" x2="26" y2="21" stroke="#A94524" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Liquid fill line -->
    <path d="M 13 17 Q 20 19 27 17" stroke="#A94524" stroke-width="1.2" fill="none" stroke-dasharray="1 1"/>
  </g>
  <!-- Wordmark -->
  <text x="48" y="31" font-family="'Newsreader', Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" fill="#17202A" letter-spacing="-0.02em">Grams <tspan fill="#A94524" font-style="italic" font-weight="400">to</tspan> Cups</text>
</svg>
